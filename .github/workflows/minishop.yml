name: MiniShop Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply MiniShop infrastructure changes"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-minishop
  cancel-in-progress: false

jobs:
  minishop:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Build MiniShop images
        shell: bash
        run: |
          set -euo pipefail
          for component in catalog order; do
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --load \
              -t "minishop-${component}:latest" \
              "minishop/${component}-service"
          done

      - name: Start catalog for integration tests
        run: |
          docker run -d --name minishop-catalog-test \
            --network host minishop-catalog:latest
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-all-errors --max-time 5 \
            http://127.0.0.1:8001/health

      - name: Run catalog tests (3 tests)
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            -v "$PWD/minishop/catalog-service/tests:/tests:ro" \
            minishop-catalog:latest \
            python -m unittest discover -s /tests -p 'test_*.py' -v

      - name: Run order tests including integration (4 tests)
        run: |
          docker run --rm --network host \
            -e PYTHONPATH=/app \
            -e CATALOG_URL=http://127.0.0.1:8001 \
            -v "$PWD/minishop/order-service/tests:/tests:ro" \
            minishop-order:latest \
            python -m unittest discover -s /tests -p 'test_*.py' -v

      - name: Check order container with real catalog
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name minishop-order-test --network host \
            -e CATALOG_URL=http://127.0.0.1:8001 \
            minishop-order:latest
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-all-errors --max-time 5 \
            http://127.0.0.1:8002/health
          HTTP_CODE=$(curl --silent --show-error --max-time 10 \
            --output order-response.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"product_id":1,"quantity":2}' \
            http://127.0.0.1:8002/orders)
          cat order-response.json
          test "$HTTP_CODE" = "201"
          jq -e '.product_name == "Laptop" and .quantity == 2 and .total_price == 50000 and .status == "created"' order-response.json

      - name: Show logs and remove test containers
        if: always()
        shell: bash
        run: |
          for container in minishop-order-test minishop-catalog-test; do
            if docker container inspect "$container" > /dev/null 2>&1; then
              docker logs "$container"
              docker rm -f "$container"
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
          mask-aws-account-id: true

      - name: Install lightsailctl
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl \
            --output "$RUNNER_TEMP/lightsailctl"
          sudo install -m 0755 "$RUNNER_TEMP/lightsailctl" /usr/local/bin/lightsailctl

      - name: Push MiniShop images to Lightsail
        shell: bash
        run: |
          set -euo pipefail
          for component in catalog order; do
            IMAGE_LABEL="${component}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            aws lightsail push-container-image \
              --service-name minishop-lab \
              --label "$IMAGE_LABEL" \
              --image "minishop-${component}:latest" \
              --region eu-north-1 \
              --no-cli-pager

            IMAGE_REF=$(aws lightsail get-container-images \
              --service-name minishop-lab \
              --region eu-north-1 \
              --output json --no-cli-pager |
              jq -er --arg prefix ":minishop-lab.${IMAGE_LABEL}." '
                [.containerImages[]? | select(.image | startswith($prefix))]
                | sort_by(.createdAt) | last | .image // empty
              ')

            echo "TF_VAR_${component}_image=$IMAGE_REF" >> "$GITHUB_ENV"
            echo "Registered ${component} image: $IMAGE_REF"
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Terraform Format
        working-directory: terraform-minishop
        run: terraform fmt -check -diff

      - name: Terraform Init
        working-directory: terraform-minishop
        run: terraform init -input=false -no-color

      - name: Terraform Validate
        working-directory: terraform-minishop
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: terraform-minishop
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=plan.tfplan

      - name: Terraform Apply
        if: inputs.apply
        working-directory: terraform-minishop
        run: terraform apply -input=false -no-color -lock-timeout=5m plan.tfplan
