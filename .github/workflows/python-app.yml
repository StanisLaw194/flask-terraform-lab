name: Flask CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply Terraform changes to AWS"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-lab
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Check Python code
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: python -m unittest -v test.py

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            -t flask-lab:latest .
            
      - name: Start container
        run: docker run -d --name flask-test -p 127.0.0.1:8080:8080 flask-lab:latest

      - name: Check container response
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --max-time 5 \
            http://127.0.0.1:8080/ -o response.txt

          cat response.txt
          test "$(cat response.txt)" = "Hello world from app Pipeline testing."
          echo "Container check passed"

      - name: Show logs and remove container
        if: always()
        run: |
          if docker container inspect flask-test > /dev/null 2>&1; then
            docker logs flask-test
            docker rm -f flask-test
          fi


      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
          mask-aws-account-id: true

      - name: Check AWS connection
        if: github.event_name != 'pull_request'
        run: |
          aws sts get-caller-identity
          echo "AWS connection successful"

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY_URI: ${{ secrets.REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag flask-lab:latest "$REPOSITORY_URI:$IMAGE_TAG"
          docker tag flask-lab:latest "$REPOSITORY_URI:latest"

          docker push "$REPOSITORY_URI:$IMAGE_TAG"
          docker push "$REPOSITORY_URI:latest"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -diff

      - name: Terraform Init
        working-directory: terraform
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            terraform init -backend=false -input=false -no-color
          else
            terraform init -input=false -no-color
          fi

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        if: github.event_name != 'pull_request'
        working-directory: terraform
        env:
          TF_VAR_image_uri: ${{ secrets.REPOSITORY_URI }}:${{ github.sha }}
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=plan.tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform apply -input=false -no-color -lock-timeout=5m plan.tfplan
